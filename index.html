<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<title>NEXUS // Personal Command OS</title>
<style>
:root{
  --bg:#06080a;--panel:#0b0f12;--panel2:#101419;
  --orange:#7fd8ff;--orange2:#4ca9d4;--red:#ff472e;--green:#8bd47f;
  --text:#f2ede5;--muted:#8c877f;--line:rgba(127,216,255,.3);--soft:rgba(127,216,255,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:
radial-gradient(circle at 50% 42%,rgba(127,216,255,.055),transparent 26%),
linear-gradient(180deg,#061017,#08131a 50%,#05090c)}
button,input,textarea,a{font:inherit}.mono{font-family:"SFMono-Regular",Consolas,monospace}
button{color:inherit}
.app{min-height:100svh;padding:22px;position:relative;overflow:hidden}
.gridbg{position:absolute;inset:0;pointer-events:none;opacity:.34;background-image:
linear-gradient(rgba(127,216,255,.022) 1px,transparent 1px),
linear-gradient(90deg,rgba(127,216,255,.022) 1px,transparent 1px);
background-size:52px 52px;mask-image:radial-gradient(circle,#000 20%,transparent 82%)}

.top{position:relative;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;gap:18px;min-height:88px}
.brand{display:flex;gap:12px}.mark{width:27px;height:27px;border:1px solid var(--orange);transform:rotate(45deg);position:relative}
.mark:after{content:"";position:absolute;inset:8px;border:1px solid var(--red)}
.logo{font-size:21px;letter-spacing:.31em;color:var(--orange)}.sub{font-size:9px;letter-spacing:.12em;color:var(--orange2);margin-top:4px}
.clock{text-align:center}.time{font-size:29px;color:var(--orange)}.date{font-size:10px;color:#b8b0a5;margin-top:5px}
.sync{font-size:9px;color:var(--muted);margin-top:8px}.syncdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:5px}
.topright{text-align:right;color:var(--orange);font-size:9px;padding-top:7px}
.topactions{display:flex;justify-content:flex-end;gap:7px;margin-top:7px}

.layout{position:relative;z-index:2;display:grid;grid-template-columns:minmax(230px,305px) minmax(410px,1fr) minmax(240px,320px);gap:20px;min-height:calc(100svh - 145px)}
.col{display:flex;flex-direction:column;gap:15px;min-width:0}
.panel{border:1px solid var(--line);background:linear-gradient(180deg,rgba(15,19,23,.94),rgba(6,9,11,.82));clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,13px 100%,0 calc(100% - 13px))}
.inner{padding:15px}
.ptitle{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--orange);font-size:10px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px}
.small{font-size:8px;color:var(--muted)}.danger{color:var(--red)!important}.ok{color:var(--green)!important}

.queue-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.qtab{border:1px solid rgba(127,216,255,.2);background:transparent;color:var(--muted);font-size:8px;padding:6px 8px;cursor:pointer}
.qtab.active{color:var(--orange);border-color:rgba(127,216,255,.6);background:rgba(127,216,255,.05)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid rgba(127,216,255,.08)}
.item:first-child{border-top:0}.item.selectable{cursor:pointer}
.item.selectable:hover{background:rgba(127,216,255,.025)}
.dia{width:26px;height:26px;border:1px solid rgba(127,216,255,.46);transform:rotate(45deg);display:grid;place-items:center}
.dia span{transform:rotate(-45deg);color:var(--orange);font-size:8px}.iname{font-size:11px}.imeta{font-size:8px;color:var(--muted);margin-top:3px}
.iright{font-size:8px;color:var(--orange);text-align:right}.openmini{display:block;color:var(--orange);text-decoration:none;margin-top:3px;font-size:7px}

.statuses{display:grid;gap:7px;margin-top:auto}.status{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:9px 0;border-top:1px solid rgba(127,216,255,.07)}
.status:first-child{border-top:0}.sname{font-size:9px;color:var(--orange)}.smeta{font-size:7px;color:var(--muted);margin-top:2px}.sval{font-size:8px}

.center{position:relative;min-height:100%;display:grid;place-items:center;padding:35px 28px 98px}
.rings{position:absolute;inset:5% 1% 13%;opacity:.78;pointer-events:none}.ring{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;border:1px solid rgba(127,216,255,.1);border-radius:50%;transform:translate(-50%,-50%)}
.ring:before,.ring:after{content:"";position:absolute;left:50%;top:50%;aspect-ratio:1;border:1px solid rgba(127,216,255,.08);border-radius:50%;transform:translate(-50%,-50%)}
.ring:before{width:82%}.ring:after{width:118%}.axis{position:absolute;top:4%;bottom:10%;left:50%;width:1px;background:linear-gradient(transparent,rgba(127,216,255,.14),transparent)}

.core{position:relative;z-index:2;width:min(100%,660px);text-align:center;padding:43px 34px;border:1px solid rgba(127,216,255,.42);background:rgba(6,8,10,.78);clip-path:polygon(12% 0,88% 0,100% 18%,100% 82%,88% 100%,12% 100%,0 82%,0 18%)}
.emblem{width:41px;height:41px;border:1px solid var(--orange);transform:rotate(45deg);margin:0 auto 24px;position:relative}.emblem:after{content:"";position:absolute;inset:13px;background:var(--red);box-shadow:0 0 18px rgba(255,71,46,.42)}
.kicker{font-size:9px;color:var(--orange);letter-spacing:.12em}.focus{font-size:clamp(27px,3.6vw,48px);line-height:1.03;color:var(--orange);margin:12px 0 9px;font-weight:500}
.course{font-size:11px;color:#aea69b}.details{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:8px;color:var(--muted)}.details strong{color:#d7cec2;font-weight:500}
.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:22px}
.btn{border:1px solid rgba(127,216,255,.44);background:rgba(11,15,18,.86);color:var(--orange);padding:9px 13px;text-transform:uppercase;text-decoration:none;font-size:8px;letter-spacing:.08em;cursor:pointer;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.btn.primary{border-color:rgba(255,71,46,.65);color:var(--red)}.btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.breakdown{display:none;margin-top:17px;padding-top:14px;border-top:1px solid rgba(127,216,255,.14);text-align:left}.breakdown.open{display:block}
.break-title{color:var(--orange);font-size:9px;letter-spacing:.09em}.breakdown ol{margin:10px 0 0;padding-left:18px;color:#bbb3a8;font-size:10px;line-height:1.6}.desc{margin-top:9px;color:var(--muted);font-size:9px;line-height:1.5;max-height:90px;overflow:auto}

.nav{position:absolute;z-index:4;bottom:15px;left:50%;transform:translateX(-50%);width:min(700px,89%);display:grid;grid-template-columns:repeat(5,1fr);border:1px solid rgba(127,216,255,.2);background:rgba(6,8,10,.94)}
.nav button{border:0;background:none;color:#9f978d;padding:12px 4px;font-size:7px;text-transform:uppercase;cursor:pointer}.nav .active{color:var(--red);box-shadow:inset 0 -2px var(--red)}

.media{display:flex;flex-direction:column;gap:9px}.media-screen{position:relative;border:1px solid rgba(127,216,255,.2);background:#000;min-height:145px;overflow:hidden}
.media-screen iframe{width:100%;height:165px;border:0;display:block}.media-overlay{position:absolute;left:0;right:0;bottom:0;padding:9px;background:linear-gradient(transparent,rgba(0,0,0,.92))}
.media-now{font-size:7px;color:var(--orange);letter-spacing:.1em}.media-title{font-size:11px;margin-top:3px}.media-row{display:flex;gap:6px}.media-input{width:100%;background:#07090b;border:1px solid rgba(127,216,255,.25);color:var(--text);padding:8px;font-size:8px;outline:none}.media-input:focus{border-color:var(--orange)}
.wave{height:20px;display:flex;align-items:end;gap:3px}.wave i{display:block;width:3px;background:var(--orange);opacity:.85;animation:pulse 1s ease-in-out infinite alternate}.wave i:nth-child(1){height:7px}.wave i:nth-child(2){height:16px;animation-delay:.2s}.wave i:nth-child(3){height:10px;animation-delay:.4s}.wave i:nth-child(4){height:18px;animation-delay:.1s}.wave i:nth-child(5){height:12px;animation-delay:.3s}
@keyframes pulse{to{height:5px;opacity:.35}}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}
.modalbox{width:min(820px,100%);max-height:85svh;overflow:auto;border:1px solid var(--line);background:#090c0f;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;color:var(--orange)}
.listsection{margin-top:15px}.listlabel{font-size:9px;color:var(--orange);letter-spacing:.1em;margin-bottom:5px}
.notearea{width:100%;min-height:220px;background:#06080a;color:var(--text);border:1px solid rgba(127,216,255,.25);padding:12px;resize:vertical}

.loading{color:var(--orange);font-size:10px;letter-spacing:.1em}


.media-playlist{
  border:1px solid rgba(127,216,255,.16);
  background:rgba(4,6,8,.72);
  max-height:230px;
  overflow:auto;
}
.track{
  display:grid;
  grid-template-columns:28px 1fr auto;
  gap:8px;
  align-items:center;
  padding:9px 10px;
  border-top:1px solid rgba(127,216,255,.07);
  cursor:pointer;
}
.track:first-child{border-top:0}
.track:hover{background:rgba(127,216,255,.035)}
.track.active{
  background:rgba(127,216,255,.07);
  box-shadow:inset 2px 0 var(--red);
}
.track-num{
  font-size:8px;
  color:var(--muted);
}
.track.active .track-num,
.track.active .track-name{
  color:var(--orange);
}
.track-name{
  font-size:9px;
  color:#d6cfc6;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.track-duration{
  font-size:8px;
  color:var(--muted);
}
.media-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.media-count{
  font-size:7px;
  color:var(--muted);
  letter-spacing:.08em;
}


.daily-strip{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:10px;
}
.daily-stat{
  border:1px solid rgba(127,216,255,.16);
  background:rgba(127,216,255,.025);
  padding:9px;
}
.daily-stat-label{
  font-size:7px;
  color:var(--muted);
  letter-spacing:.08em;
}
.daily-stat-value{
  margin-top:4px;
  font-size:11px;
  color:var(--orange);
}
.overload{
  margin-top:8px;
  padding:8px;
  border:1px solid rgba(255,71,46,.28);
  color:var(--red);
  font-size:8px;
  display:none;
}
.overload.show{display:block}
.plan-item{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:10px;
  align-items:center;
  padding:11px 0;
  border-top:1px solid rgba(127,216,255,.08);
}
.plan-item:first-child{border-top:0}
.plan-actions{
  display:flex;
  gap:5px;
  margin-top:5px;
  flex-wrap:wrap;
}
.mini-btn{
  border:1px solid rgba(127,216,255,.25);
  background:transparent;
  color:var(--orange);
  padding:4px 6px;
  font-size:7px;
  cursor:pointer;
}
.mini-btn.danger{border-color:rgba(255,71,46,.25)}
.plan-done .iname{
  text-decoration:line-through;
  opacity:.5;
}
.plan-done .imeta{opacity:.45}


.schedule-shell{
  display:grid;
  grid-template-columns:210px 1fr;
  gap:14px;
}
.schedule-sidebar{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.schedule-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.schedule-block{
  border:1px solid rgba(127,216,255,.18);
  padding:9px;
  background:rgba(127,216,255,.025);
}
.schedule-block strong{
  display:block;
  color:var(--orange);
  font-size:9px;
  margin-bottom:3px;
}
.schedule-block span{
  font-size:8px;
  color:var(--muted);
}
.schedule-form{
  display:grid;
  gap:7px;
}
.schedule-input,
.schedule-select{
  width:100%;
  background:#06080a;
  color:var(--text);
  border:1px solid rgba(127,216,255,.22);
  padding:8px;
  font-size:8px;
}
.timeline{
  position:relative;
  border-left:1px solid rgba(127,216,255,.22);
  min-height:840px;
  margin-left:12px;
}
.hour-row{
  position:absolute;
  left:-12px;
  right:0;
  height:60px;
  border-top:1px solid rgba(127,216,255,.07);
}
.hour-label{
  position:absolute;
  left:-48px;
  top:-6px;
  font-size:7px;
  color:var(--muted);
  width:34px;
  text-align:right;
}
.timeline-event{
  position:absolute;
  left:10px;
  right:10px;
  border:1px solid rgba(127,216,255,.32);
  background:rgba(127,216,255,.055);
  padding:7px 9px;
  overflow:hidden;
  min-height:28px;
}
.timeline-event.class{border-color:rgba(127,216,255,.48)}
.timeline-event.work{border-color:rgba(255,71,46,.48)}
.timeline-event.commute{border-color:rgba(214,109,19,.42)}
.timeline-event.personal{border-color:rgba(139,212,127,.36)}
.timeline-event.task{
  border-color:rgba(127,216,255,.62);
  background:rgba(127,216,255,.09);
}
.timeline-event-title{
  font-size:8px;
  color:var(--orange);
}
.timeline-event-time{
  margin-top:2px;
  font-size:7px;
  color:var(--muted);
}
.auto-plan-status{
  margin-top:8px;
  font-size:8px;
  color:var(--muted);
}
.calendar-summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:12px;
}
.calendar-chip{
  border:1px solid rgba(127,216,255,.15);
  padding:8px;
}
.calendar-chip .v{
  color:var(--orange);
  font-size:10px;
  margin-top:3px;
}
@media(max-width:760px){
  .schedule-shell{grid-template-columns:1fr}
  .timeline{margin-left:36px}
  .calendar-summary{grid-template-columns:repeat(2,1fr)}
}


.mission-summary{
  margin-top:14px;
  padding:10px 12px;
  border:1px solid rgba(127,216,255,.18);
  background:rgba(127,216,255,.025);
  text-align:left;
}
.mission-summary-label{
  font-size:7px;
  color:var(--muted);
  letter-spacing:.1em;
}
.mission-summary-text{
  margin-top:5px;
  font-size:11px;
  color:#dce9ef;
  line-height:1.45;
}
.eta-editor{
  display:flex;
  gap:6px;
  align-items:center;
  margin-top:8px;
  justify-content:center;
  flex-wrap:wrap;
}
.eta-input{
  width:68px;
  background:#061017;
  color:var(--text);
  border:1px solid rgba(127,216,255,.24);
  padding:7px;
  font-size:8px;
}
.req-grid{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:9px;
}
.req-chip{
  border:1px solid rgba(127,216,255,.16);
  color:var(--muted);
  padding:5px 7px;
  font-size:7px;
}


/* PRIORITY 5 — MOBILE / PWA */
.mobile-only{display:none}
.mobile-statusbar{
  display:none;
}
.mobile-install{
  display:none;
}
@media(max-width:760px){
  body{
    padding-bottom:76px;
    overflow-x:hidden;
  }

  .topbar{
    position:sticky;
    top:0;
    z-index:40;
    backdrop-filter:blur(14px);
    background:rgba(5,12,17,.92);
  }

  .grid,
  .main-grid,
  .layout,
  .hud-grid{
    display:block !important;
  }

  .left,.center,.right{
    width:100% !important;
    min-width:0 !important;
  }

  .center{
    order:1;
  }

  .left{
    order:2;
  }

  .right{
    order:3;
  }

  .panel{
    margin-bottom:10px;
  }

  .inner{
    padding:12px;
  }

  .focus,
  .objective,
  .core{
    min-height:auto !important;
  }

  .mission-summary{
    margin-top:10px;
  }

  .daily-strip{
    grid-template-columns:repeat(2,1fr);
  }

  .actions{
    display:grid !important;
    grid-template-columns:1fr 1fr;
    gap:8px !important;
  }

  .actions .btn,
  .btn{
    min-height:42px;
    font-size:9px;
  }

  .plan-actions{
    gap:7px;
  }

  .mini-btn{
    min-height:34px;
    padding:7px 9px;
    font-size:8px;
  }

  .plan-item{
    grid-template-columns:auto 1fr;
  }

  .plan-item .iright{
    display:none;
  }

  .eta-editor{
    justify-content:flex-start;
  }

  .eta-input{
    min-height:38px;
    font-size:9px;
  }

  .media-dock,
  #mediaDock,
  .player-panel{
    max-height:54px;
    overflow:hidden;
    transition:max-height .2s ease;
  }

  .media-dock.mobile-open,
  #mediaDock.mobile-open,
  .player-panel.mobile-open{
    max-height:700px;
  }

  .bottomnav,
  .bottom-nav,
  nav.bottom,
  .commandbar{
    position:fixed !important;
    left:8px;
    right:8px;
    bottom:8px;
    z-index:60;
    display:grid !important;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    background:rgba(5,12,17,.96);
    border:1px solid rgba(127,216,255,.2);
    backdrop-filter:blur(16px);
    padding:7px;
    border-radius:12px;
  }

  .bottomnav button,
  .bottom-nav button,
  nav.bottom button,
  .commandbar button{
    min-height:46px;
    font-size:8px;
  }

  .mobile-statusbar{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    margin:8px 0 10px;
  }

  .mobile-statuschip{
    border:1px solid rgba(127,216,255,.15);
    padding:7px;
    text-align:center;
    background:rgba(127,216,255,.02);
  }

  .mobile-statuschip .label{
    font-size:6px;
    color:var(--muted);
  }

  .mobile-statuschip .value{
    margin-top:3px;
    font-size:9px;
    color:var(--orange);
  }

  .mobile-install{
    display:inline-flex;
  }

  .modal,
  .modal-card{
    width:calc(100vw - 18px) !important;
    max-width:none !important;
    max-height:88vh;
  }

  .schedule-shell{
    grid-template-columns:1fr !important;
  }

  .timeline{
    margin-left:38px;
  }
}


/* PRIORITY 6 — MEDIA DOCK */
.media-shell{
  display:grid;
  grid-template-columns:96px 1fr;
  gap:12px;
  align-items:start;
}
.media-art{
  width:96px;
  aspect-ratio:1/1;
  object-fit:cover;
  border:1px solid rgba(127,216,255,.22);
  background:#071018;
}
.media-now{
  min-width:0;
}
.media-now-title{
  font-size:11px;
  color:#dce9ef;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.media-now-channel{
  margin-top:4px;
  font-size:7px;
  color:var(--muted);
}
.media-controls{
  display:flex;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.media-control-btn{
  border:1px solid rgba(127,216,255,.22);
  background:rgba(127,216,255,.025);
  color:var(--orange);
  min-width:38px;
  min-height:32px;
  padding:6px 8px;
  font-size:8px;
  cursor:pointer;
}
.media-control-btn:hover{
  background:rgba(127,216,255,.06);
}
.media-track-list{
  margin-top:10px;
  max-height:230px;
  overflow:auto;
  border-top:1px solid rgba(127,216,255,.08);
}
.media-track{
  display:grid;
  grid-template-columns:28px 42px 1fr auto;
  gap:8px;
  align-items:center;
  padding:8px 2px;
  border-bottom:1px solid rgba(127,216,255,.06);
  cursor:pointer;
}
.media-track:hover{
  background:rgba(127,216,255,.025);
}
.media-track.active{
  background:rgba(127,216,255,.055);
}
.media-track-thumb{
  width:42px;
  height:42px;
  object-fit:cover;
  border:1px solid rgba(127,216,255,.12);
}
.media-track-title{
  color:#dce9ef;
  font-size:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.media-track-channel{
  margin-top:3px;

<script>
let dashboard=null,current=null,currentScope="today",deferredPrompt=null;
const $=id=>document.getElementById(id);

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c])}
function updateClock(){const d=new Date();$("clock").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false});$("date").textContent=d.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric",year:"numeric"}).toUpperCase()}
updateClock();setInterval(updateClock,1000);

function relDue(iso){if(!iso)return"NO DEADLINE";const ms=new Date(iso)-Date.now(),h=Math.floor(Math.abs(ms)/36e5);if(ms<0)return h<24?`${h}H OVERDUE`:`${Math.floor(h/24)}D OVERDUE`;if(h<1)return"UNDER 1H";if(h<24)return`IN ${h}H`;return`IN ${Math.floor(h/24)}D`}
function state(a){if(!a)return"--";if(a.missing)return"MISSING";if(a.overdue)return"OVERDUE";if(a.submitted)return"SUBMITTED";if(a.locked)return"LOCKED";return"PENDING"}
function formatMin(m){if(!m)return"--";if(m<60)return`${m}M`;const h=Math.floor(m/60),r=m%60;return r?`${h}H ${r}M`:`${h}H`}


function etaOverrideKey(a){
  return a ? `nexus_eta_${a.courseId}_${a.id}` : "";
}

function effectiveEta(a){
  if(!a) return null;
  const saved = Number(localStorage.getItem(etaOverrideKey(a)));
  return saved > 0 ? saved : a.estimatedMinutes;
}

function requirementChips(a){
  const r=a?.requirements || {};
  const chips=[];
  if(r.wordCount) chips.push(r.wordCount);
  if(r.replies) chips.push(`${r.replies} replies`);
  if(r.upload) chips.push("file upload");
  if(r.onPaper) chips.push("in person");
  if(r.quiz) chips.push("quiz");
  if(r.exam) chips.push("exam");
  if(r.reading) chips.push("reading");
  return chips;
}

function setFocus(a){
  current=a||null;$("breakdown").classList.remove("open");
  if(!a){$("focusTitle").textContent="CLEAR";$("focusCourse").textContent="No actionable Canvas assignments";$("focusSummary").textContent="Nothing urgent right now.";$("focusRequirements").innerHTML="";$("focusDue").textContent="--";$("focusPoints").textContent="--";$("focusEta").textContent="--";$("focusState").textContent="CLEAR";$("canvasBtn").removeAttribute("href");$("canvasBtn").setAttribute("aria-disabled","true");$("stepList").innerHTML="";$("focusDesc").textContent="";return}
  $("focusTitle").textContent=a.name;$("focusCourse").textContent=a.courseName||a.course;$("focusSummary").textContent=a.summary||"Complete the assignment and submit it.";$("focusRequirements").innerHTML=requirementChips(a).map(x=>`<span class="req-chip mono">${esc(x)}</span>`).join("");$("focusDue").textContent=relDue(a.dueAt);$("focusPoints").textContent=a.points??"--";$("focusEta").textContent=formatMin(effectiveEta(a));$("etaInput").value=effectiveEta(a)||"";$("focusState").textContent=state(a);$("focusDesc").textContent=a.description||"No assignment description provided by Canvas.";$("stepList").innerHTML=(a.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("");
  if(a.url){$("canvasBtn").href=a.url;$("canvasBtn").setAttribute("aria-disabled","false")}else{$("canvasBtn").removeAttribute("href");$("canvasBtn").setAttribute("aria-disabled","true")}
}

function itemHtml(a,i){
  const risk=a.overdue||a.missing;
  const right=a.locked?(a.unlockAt?`UNLOCK ${relDue(a.unlockAt).replace("IN ","")}`:"LOCKED"):relDue(a.dueAt);
  return `<div class="item selectable" data-id="${esc(a.id)}" data-course="${esc(a.courseId)}">
    <div class="dia"><span>${String(i+1).padStart(2,"0")}</span></div>
    <div><div class="iname">${esc(a.name)}</div><div class="imeta mono">${esc(a.course)} · ${esc(state(a))} · ${esc(formatMin(effectiveEta(a)))}</div>${a.url?`<a class="openmini mono" target="_blank" rel="noopener" href="${esc(a.url)}">OPEN CANVAS ↗</a>`:""}</div>
    <div class="iright mono ${risk?"danger":""}">${esc(right)}</div>
  </div>`;
}

function getScope(){
  if(!dashboard)return[];
  if(currentScope==="today")return dashboard.today||[];
  if(currentScope==="week")return dashboard.thisWeek||[];
  if(currentScope==="later")return (dashboard.later||[]).slice(0,12);
  return dashboard.lockedFuture||[];
}
function renderQueue(){
  const items=getScope();$("missionQueue").innerHTML=items.length?items.map(itemHtml).join(""):`<div class="small mono">NO MISSIONS IN THIS WINDOW</div>`;
  document.querySelectorAll("#missionQueue .item").forEach(el=>{el.addEventListener("click",e=>{if(e.target.closest("a"))return;const found=dashboard.assignments.find(a=>String(a.id)===el.dataset.id&&String(a.courseId)===el.dataset.course);if(found){setFocus(found);window.scrollTo({top:0,behavior:"smooth"})}})})
}


const DAILY_LIMIT = 5;
const DAILY_OVERLOAD_MINUTES = 240;

function dailyKey(){
  const d=new Date();
  return `nexus_daily_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function getDailyState(){
  try{
    return JSON.parse(localStorage.getItem(dailyKey()) || '{"done":[],"deferred":[]}');
  }catch{
    return {done:[],deferred:[]};
  }
}

function saveDailyState(state){
  localStorage.setItem(dailyKey(), JSON.stringify(state));
}

function taskKey(a){
  return `${a.courseId}:${a.id}`;
}

function buildDailyPlan(){
  if(!dashboard) return [];

  const state=getDailyState();
  const deferred=new Set(state.deferred || []);

  const candidates=(dashboard.actionable || [])
    .filter(a=>!deferred.has(taskKey(a)))
    .sort((a,b)=>b.priority-a.priority);

  // Prefer due today first, then this week, then other actionable tasks.
  const dueToday=candidates.filter(a=>(dashboard.today||[]).some(t=>taskKey(t)===taskKey(a)));
  const dueWeek=candidates.filter(a=>(dashboard.thisWeek||[]).some(t=>taskKey(t)===taskKey(a)));
  const rest=candidates.filter(a=>!dueToday.includes(a)&&!dueWeek.includes(a));

  return [...dueToday,...dueWeek,...rest].slice(0,DAILY_LIMIT);
}

function renderDailyPlan(){
  const plan=buildDailyPlan();
  const state=getDailyState();
  const done=new Set(state.done || []);

  const totalMinutes=plan.reduce((sum,a)=>sum+(Number(a.estimatedMinutes)||0),0);
  const completed=plan.filter(a=>done.has(taskKey(a))).length;

  $("todayMissionCount").textContent=plan.length;
  $("todayWorkload").textContent=formatMin(totalMinutes);
  $("todayDone").textContent=`${completed}/${plan.length}`;
  $("dayStatus").textContent=plan.length ? "ACTIVE" : "CLEAR";

  const overload=totalMinutes>DAILY_OVERLOAD_MINUTES;
  $("overloadWarning").classList.toggle("show", overload);

  if(!plan.length){
    $("dailyPlan").innerHTML=`<div class="small mono ok">NO DAILY MISSIONS REQUIRED</div>`;
    return;
  }

  $("dailyPlan").innerHTML=plan.map((a,i)=>{
    const isDone=done.has(taskKey(a));
    return `<div class="plan-item ${isDone?"plan-done":""}" data-daily-id="${esc(a.id)}" data-daily-course="${esc(a.courseId)}">
      <div class="dia"><span>${String(i+1).padStart(2,"0")}</span></div>
      <div>
        <div class="iname">${esc(a.name)}</div>
        <div class="imeta mono">${esc(a.course)} · ${esc(formatMin(a.estimatedMinutes))} · ${esc(relDue(a.dueAt))}</div>
        <div class="plan-actions">
          <button class="mini-btn daily-focus">FOCUS</button>
          <button class="mini-btn daily-done">${isDone?"UNDO":"DONE"}</button>
          <button class="mini-btn danger daily-defer">DEFER</button>
        </div>
      </div>
      <div class="iright mono">${isDone?"DONE":"PENDING"}</div>
    </div>`;
  }).join("");

  document.querySelectorAll(".plan-item").forEach(el=>{
    const a=dashboard.assignments.find(x=>String(x.id)===el.dataset.dailyId&&String(x.courseId)===el.dataset.dailyCourse);
    if(!a) return;

    el.querySelector(".daily-focus").addEventListener("click",()=>{
      setFocus(a);
      window.scrollTo({top:0,behavior:"smooth"});
    });

    el.querySelector(".daily-done").addEventListener("click",()=>{
      const s=getDailyState();
      const key=taskKey(a);
      s.done=s.done || [];
      if(s.done.includes(key)) s.done=s.done.filter(x=>x!==key);
      else s.done.push(key);
      saveDailyState(s);
      renderDailyPlan();

      const next=buildDailyPlan().find(x=>!(getDailyState().done||[]).includes(taskKey(x)));
      if(next) setFocus(next);
    });

    el.querySelector(".daily-defer").addEventListener("click",()=>{
      const s=getDailyState();
      const key=taskKey(a);
      s.deferred=s.deferred || [];
      if(!s.deferred.includes(key)) s.deferred.push(key);
      saveDailyState(s);
      renderDailyPlan();

      const next=buildDailyPlan().find(x=>!(getDailyState().done||[]).includes(taskKey(x)));
      if(next) setFocus(next);
    });
  });

  // Keep the center objective aligned to the next unfinished daily mission.
  const next=plan.find(a=>!done.has(taskKey(a)));
  if(next) setFocus(next);
}


let deferredInstallPrompt = null;
let lastDashboardSync = null;

function canvasCacheKey(){
  return "nexus_canvas_cache_v1";
}

function saveCanvasCache(data){
  try{
    localStorage.setItem(canvasCacheKey(), JSON.stringify({
      savedAt: Date.now(),
      data
    }));
  }catch{}
}

function loadCanvasCache(){
  try{
    const raw=JSON.parse(localStorage.getItem(canvasCacheKey()) || "null");
    return raw?.data || null;
  }catch{
    return null;
  }
}

function updateMobileStatus(){
  const next = current?.name || dashboard?.next?.name || "CLEAR";
  const todayCount = buildDailyPlan ? buildDailyPlan().length : 0;

  const shortNext = next.length > 16 ? next.slice(0,14)+"…" : next;
  if($("mobileNext")) $("mobileNext").textContent=shortNext;
  if($("mobileToday")) $("mobileToday").textContent=String(todayCount);
  if($("mobileSync")) $("mobileSync").textContent=lastDashboardSync ? "LIVE" : "CACHE";
}

function reminderSettingsKey(){
  return "nexus_reminder_settings_v1";
}

function getReminderSettings(){
  try{
    return JSON.parse(localStorage.getItem(reminderSettingsKey()) || '{"enabled":false,"hours":[24,6,1]}');
  }catch{
    return {enabled:false,hours:[24,6,1]};
  }
}

function notificationSeenKey(a,hours){
  return `nexus_notified_${a.courseId}_${a.id}_${hours}`;
}

async function enableNotifications(){
  if(!("Notification" in window)){
    alert("Notifications are not supported in this browser.");
    return;
  }

  const permission = await Notification.requestPermission();
  if(permission !== "granted"){
    alert("Notification permission was not granted.");
    return;
  }

  localStorage.setItem(reminderSettingsKey(), JSON.stringify({
    enabled:true,
    hours:[24,6,1]
  }));

  if($("notifyBtn")) $("notifyBtn").textContent="ALERTS ON";
  checkDeadlineReminders();
}

async function sendLocalNotification(title,body,url){
  if(!("Notification" in window) || Notification.permission!=="granted") return;

  if("serviceWorker" in navigator){
    try{
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title,{
        body,
        icon:"/icon-192.png",
        badge:"/icon-192.png",
        data:{url:url||"/"},
        tag:title+body
      });
      return;
    }catch{}
  }

  new Notification(title,{body});
}

function checkDeadlineReminders(){
  const settings=getReminderSettings();
  if(!settings.enabled || !dashboard?.assignments?.length) return;

  const now=Date.now();

  dashboard.assignments.forEach(a=>{
    if(!a.dueAt || a.submitted || a.locked) return;

    const due=new Date(a.dueAt).getTime();
    const diffHours=(due-now)/3600000;

    for(const h of settings.hours){
      if(diffHours>0 && diffHours<=h){
        const key=notificationSeenKey(a,h);
        if(localStorage.getItem(key)) continue;

        localStorage.setItem(key,"1");
        sendLocalNotification(
          `NEXUS // ${h}H DEADLINE`,
          `${a.name} is due ${relDue(a.dueAt)}.`,
          a.htmlUrl
        );
        break;
      }
    }
  });
}

function collapseMediaOnMobile(){
  if(window.innerWidth>760) return;
  const dock = document.querySelector(".media-dock,#mediaDock,.player-panel");
  if(!dock) return;

  dock.classList.remove("mobile-open");

  const title = dock.querySelector(".ptitle,.panel-title,.title");
  if(title && !title.dataset.mobileBound){
    title.dataset.mobileBound="1";
    title.style.cursor="pointer";
    title.addEventListener("click",()=>dock.classList.toggle("mobile-open"));
  }
}

window.addEventListener("beforeinstallprompt",(e)=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  if($("installBtn")) $("installBtn").style.display="inline-flex";
});

window.addEventListener("appinstalled",()=>{
  deferredInstallPrompt=null;
  if($("installBtn")) $("installBtn").style.display="none";
});

window.addEventListener("online",()=>{
  if($("mobileSync")) $("mobileSync").textContent="LIVE";
});

window.addEventListener("offline",()=>{
  if($("mobileSync")) $("mobileSync").textContent="OFFLINE";
});

async function loadCanvas(){
  $("syncBtn").textContent="SYNCING";
  try{
    const r=await fetch("/api/canvas",{cache:"no-store",headers:{Accept:"application/json"}});
    const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{throw new Error(`API returned non-JSON (${r.status})`)}
    if(!r.ok||!data.ok)throw new Error(data.details||data.error||`Canvas returned ${r.status}`);
    dashboard=data;$("syncText").textContent="ONLINE";$("systemStatus").textContent="ONLINE";$("systemStatus").className="sval mono ok";$("courseCount").textContent=`${data.stats.courses} COURSES`;$("activeCount").textContent=`${data.stats.actionable} ACTIVE`;$("uniValue").textContent=data.stats.actionable;$("alertCount").textContent=`${data.stats.overdue} RISK`;$("syncAge").textContent=`SYNC ${new Date(data.syncedAt).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}`;renderQueue();renderDailyPlan();updateMobileStatus();collapseMediaOnMobile();checkDeadlineReminders();
    const alerts=[...(data.overdue||[]),...(data.dueSoon||[]).filter(x=>!(data.overdue||[]).some(o=>o.id===x.id&&o.courseId===x.courseId))].slice(0,6);
    $("alerts").innerHTML=alerts.length?alerts.map(itemHtml).join(""):`<div class="small mono ok">NO IMMEDIATE DEADLINE RISKS</div>`;setFocus(data.next);
  }catch(err){$("syncText").textContent="ERROR";$("systemStatus").textContent="ERROR";$("systemStatus").className="sval mono danger";$("focusTitle").textContent="SYNC FAILURE";$("focusCourse").textContent=err.message;$("missionQueue").innerHTML=`<div class="small mono danger">${esc(err.message)}</div>`;$("alerts").innerHTML=`<div class="small mono danger">CHECK /api/canvas</div>`}
  finally{$("syncBtn").textContent="SYNC"}
}

$("saveEtaBtn").addEventListener("click",()=>{
  if(!current) return;
  const minutes = Number($("etaInput").value);
  if(!Number.isFinite(minutes) || minutes < 5) return;
  localStorage.setItem(etaOverrideKey(current), String(Math.round(minutes)));
  $("focusEta").textContent = formatMin(Math.round(minutes));
  renderQueue();
  if(typeof renderDailyPlan === "function") renderDailyPlan();
});


if($("notifyBtn")){
  $("notifyBtn").addEventListener("click",enableNotifications);
  if(getReminderSettings().enabled && Notification.permission==="granted"){
    $("notifyBtn").textContent="ALERTS ON";
  }
}

if($("installBtn")){
  $("installBtn").addEventListener("click",async()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null;
    $("installBtn").style.display="none";
  });
}

setInterval(checkDeadlineReminders, 15*60*1000);
window.addEventListener("resize",collapseMediaOnMobile);


let nexusPlaylist = [];
let nexusTrackIndex = -1;

function extractPlaylistId(value){
  const raw=String(value||"").trim();
  if(!raw) return "";
  try{
    const u=new URL(raw);
    return u.searchParams.get("list") || "";
  }catch{
    return raw;
  }
}

function mediaTrackThumb(track){
  return track.thumbnail || track.thumbnailUrl || track.thumbnails?.medium?.url || track.thumbnails?.default?.url || "icon-192.png";
}

function mediaMusicUrl(track){
  if(track?.videoId) return `https://music.youtube.com/watch?v=${encodeURIComponent(track.videoId)}`;
  return "https://music.youtube.com/";
}

function renderMediaTracks(){
  const list=$("mediaTrackList");
  if(!list) return;

  if(!nexusPlaylist.length){
    list.innerHTML='<div class="small mono" style="padding:10px 0">NO PLAYLIST LOADED</div>';
    return;
  }

  list.innerHTML=nexusPlaylist.map((t,i)=>`
    <div class="media-track ${i===nexusTrackIndex?"active":""}" data-media-index="${i}">
      <div class="mono small">${String(i+1).padStart(2,"0")}</div>
      <img class="media-track-thumb" src="${esc(mediaTrackThumb(t))}" alt="">
      <div style="min-width:0">
        <div class="media-track-title">${esc(t.title||"Untitled")}</div>
        <div class="media-track-channel mono">${esc(t.channelTitle||t.channel||"YouTube")}</div>
      </div>
      <div class="media-track-duration mono">${esc(t.duration||"--")}</div>
    </div>
  `).join("");

  document.querySelectorAll(".media-track").forEach(el=>{
    el.addEventListener("click",()=>playNexusTrack(Number(el.dataset.mediaIndex)));
  });
}

function playNexusTrack(index){
  if(!nexusPlaylist.length) return;

  if(index<0) index=nexusPlaylist.length-1;
  if(index>=nexusPlaylist.length) index=0;

  nexusTrackIndex=index;
  const t=nexusPlaylist[index];

  if($("mediaFrame") && t.videoId){
    $("mediaFrame").src=`https://www.youtube.com/embed/${encodeURIComponent(t.videoId)}?autoplay=1&rel=0`;
  }
  if($("mediaNowTitle")) $("mediaNowTitle").textContent=t.title||"Untitled";
  if($("mediaNowChannel")) $("mediaNowChannel").textContent=t.channelTitle||t.channel||"YouTube";
  if($("mediaArt")) $("mediaArt").src=mediaTrackThumb(t);
  if($("mediaMusicLink")) $("mediaMusicLink").href=mediaMusicUrl(t);
  if($("mediaState")) $("mediaState").textContent=`TRACK ${index+1}/${nexusPlaylist.length}`;

  localStorage.setItem("nexus_media_track_index",String(index));
  renderMediaTracks();
}

async function loadNexusPlaylist(){
  const value=$("playlistInput")?.value||"";
  const listId=extractPlaylistId(value);
  if(!listId) return;

  if($("mediaState")) $("mediaState").textContent="LOADING";

  try{
    const r=await fetch(`/api/youtube-playlist?list=${encodeURIComponent(listId)}`,{cache:"no-store"});
    const data=await r.json();

    const items=data.tracks || data.items || data.playlist || [];
    if(!r.ok || !Array.isArray(items) || !items.length){
      throw new Error(data.error || "Playlist could not be loaded");
    }

    nexusPlaylist=items;
    localStorage.setItem("nexus_playlist_url",value);
    localStorage.setItem("nexus_playlist_data",JSON.stringify(items));

    const savedIndex=Math.min(
      Number(localStorage.getItem("nexus_media_track_index")||0),
      items.length-1
    );

    renderMediaTracks();
    playNexusTrack(Number.isFinite(savedIndex)?savedIndex:0);
  }catch(err){
    if($("mediaState")) $("mediaState").textContent="ERROR";
    if($("mediaTrackList")) $("mediaTrackList").innerHTML=
      `<div class="small mono" style="padding:10px 0">PLAYLIST LOAD FAILED</div>`;
  }
}

function restoreNexusMedia(){
  try{
    const url=localStorage.getItem("nexus_playlist_url")||"";
    const data=JSON.parse(localStorage.getItem("nexus_playlist_data")||"[]");
    if($("playlistInput")) $("playlistInput").value=url;

    if(Array.isArray(data) && data.length){
      nexusPlaylist=data;
      const idx=Math.min(
        Number(localStorage.getItem("nexus_media_track_index")||0),
        data.length-1
      );
      renderMediaTracks();
      playNexusTrack(Number.isFinite(idx)?idx:0);
    }
  }catch{}
}

function youtubePlaylistId(url){
  try{
    const u = new URL(url);
    return u.searchParams.get("list");
  }catch{
    return null;
  }
}

let mediaPlaylist = [];
let activeTrackIndex = -1;
let playlistCollapsed = false;

function renderPlaylist(){
  if(!mediaPlaylist.length){
    $("playlistCount").textContent = "0 TRACKS";
    $("mediaPlaylist").innerHTML =
      `<div class="small mono" style="padding:12px">NO TRACKS LOADED</div>`;
    return;
  }

  $("playlistCount").textContent =
    `${mediaPlaylist.length} TRACK${mediaPlaylist.length===1?"":"S"}`;

  $("mediaPlaylist").innerHTML = mediaPlaylist.map((t,i)=>`
    <div class="track ${i===activeTrackIndex?"active":""}" data-track="${i}">
      <div class="track-num mono">${String(i+1).padStart(2,"0")}</div>

      <div>
        <div class="track-name">${esc(t.title)}</div>
        <div class="small mono">${esc(t.channelTitle || "YOUTUBE")}</div>
      </div>

      <div class="track-duration mono">${esc(t.duration || "--:--")}</div>
    </div>
  `).join("");

  document.querySelectorAll(".track").forEach(el=>{
    el.addEventListener("click",()=>{
      playTrack(Number(el.dataset.track));
    });
  });
}

function playTrack(index){
  const track = mediaPlaylist[index];
  if(!track || !track.videoId) return;

  activeTrackIndex = index;

  $("mediaFrame").src =
    `https://www.youtube.com/embed/${encodeURIComponent(track.videoId)}?autoplay=1&rel=0`;

  $("mediaTitle").textContent = track.title || "UNTITLED";
  $("mediaArtist").textContent = track.channelTitle || "YOUTUBE";

  localStorage.setItem("nexus_active_track", String(index));
  renderPlaylist();
}

async function loadPlaylistFromUrl(url){
  $("mediaError").textContent = "";

  const listId = youtubePlaylistId(url);

  if(!listId){
    $("mediaError").textContent =
      "That does not look like a valid YouTube playlist URL.";
    return;
  }

  $("loadPlaylistBtn").textContent = "LOADING...";
  $("loadPlaylistBtn").disabled = true;

  try{
    const r = await fetch(
      `/api/youtube-playlist?list=${encodeURIComponent(listId)}`,
      { cache:"no-store" }
    );

    const data = await r.json();

    if(!r.ok || !data.ok){
      throw new Error(data.error || data.details || "Playlist request failed");
    }

    mediaPlaylist = data.tracks || [];
    activeTrackIndex = 0;

    localStorage.setItem("nexus_playlist_id", listId);
    localStorage.setItem("nexus_playlist_url", url);

    renderPlaylist();

    if(mediaPlaylist.length){
      playTrack(0);
    }
  }catch(err){
    $("mediaError").textContent = err.message;
  }finally{
    $("loadPlaylistBtn").textContent = "LOAD PLAYLIST";
    $("loadPlaylistBtn").disabled = false;
  }
}

$("loadPlaylistBtn").addEventListener("click",()=>{

function scheduleStorageKey(){
  return "nexus_schedule_blocks_v1";
}

function getScheduleBlocks(){
  try{
    return JSON.parse(localStorage.getItem(scheduleStorageKey()) || "[]");
  }catch{
    return [];
  }
}

function saveScheduleBlocks(items){
  localStorage.setItem(scheduleStorageKey(), JSON.stringify(items));
}

function minutesFromTime(t){
  const [h,m]=String(t||"00:00").split(":").map(Number);
  return h*60+m;
}

function timeFromMinutes(min){
  const h=Math.floor(min/60)%24;
  const m=min%60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}

function todayName(){
  return ["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()];
}

function blockAppliesToday(b){
  return !Array.isArray(b.days) || b.days.length===0 || b.days.includes(todayName());
}

function getTodayScheduleBlocks(){
  return getScheduleBlocks()
    .filter(blockAppliesToday)
    .sort((a,b)=>minutesFromTime(a.start)-minutesFromTime(b.start));
}

function findFreeSlots(blocks,startMin=8*60,endMin=23*60){
  const busy=blocks
    .map(b=>({start:minutesFromTime(b.start),end:minutesFromTime(b.end)}))
    .filter(b=>b.end>b.start)
    .sort((a,b)=>a.start-b.start);

  const merged=[];
  for(const b of busy){
    if(!merged.length || b.start>merged[merged.length-1].end){
      merged.push({...b});
    }else{
      merged[merged.length-1].end=Math.max(merged[merged.length-1].end,b.end);
    }
  }

  const slots=[];
  let cursor=startMin;
  for(const b of merged){
    if(b.start>cursor) slots.push({start:cursor,end:b.start});
    cursor=Math.max(cursor,b.end);
  }
  if(cursor<endMin) slots.push({start:cursor,end:endMin});
  return slots;
}

function autoPlaceDailyTasks(){
  const baseBlocks=getTodayScheduleBlocks();
  const state=getDailyState();
  const done=new Set(state.done||[]);
  const deferred=new Set(state.deferred||[]);
  const tasks=buildDailyPlan()
    .filter(a=>!done.has(taskKey(a)) && !deferred.has(taskKey(a)));

  const slots=findFreeSlots(baseBlocks);
  const planned=[];
  let slotIndex=0;
  let cursor=slots[0]?.start ?? null;

  for(const task of tasks){
    let need=Math.max(15,Number(task.estimatedMinutes)||45);

    while(slotIndex<slots.length){
      const slot=slots[slotIndex];
      if(cursor===null || cursor<slot.start) cursor=slot.start;
      const available=slot.end-cursor;

      if(available>=need){
        planned.push({
          id:`task-${task.courseId}-${task.id}`,
          title:task.name,
          type:"task",
          start:timeFromMinutes(cursor),
          end:timeFromMinutes(cursor+need),
          sourceTask:task
        });
        cursor+=need;
        break;
      }else{
        slotIndex++;
        cursor=slots[slotIndex]?.start ?? null;
      }
    }
  }

  return planned;
}

function renderTimelineHtml(){
  const startHour=8,endHour=22;
  const base=getTodayScheduleBlocks();
  const auto=autoPlaceDailyTasks();
  const all=[...base,...auto];

  const rows=[];
  for(let h=startHour;h<=endHour;h++){
    const top=(h-startHour)*60;
    rows.push(`<div class="hour-row" style="top:${top}px"><div class="hour-label mono">${String(h).padStart(2,"0")}:00</div></div>`);
  }

  const events=all.map(e=>{
    const start=minutesFromTime(e.start);
    const end=minutesFromTime(e.end);
    const top=(start-startHour*60);
    const height=Math.max(24,end-start);
    return `<div class="timeline-event ${esc(e.type||"personal")}" style="top:${top}px;height:${height}px">
      <div class="timeline-event-title">${esc(e.title)}</div>
      <div class="timeline-event-time mono">${esc(e.start)}–${esc(e.end)} · ${esc((e.type||"personal").toUpperCase())}</div>
    </div>`;
  }).join("");

  return `<div class="timeline" style="height:${(endHour-startHour+1)*60}px">${rows.join("")}${events}</div>`;
}

function scheduleWorkspaceHtml(){
  const blocks=getScheduleBlocks();
  const todays=getTodayScheduleBlocks();
  const auto=autoPlaceDailyTasks();
  const free=findFreeSlots(todays).reduce((s,x)=>s+(x.end-x.start),0);

  const blockList=blocks.length?blocks.map((b,i)=>`
    <div class="schedule-block">
      <strong>${esc(b.title)}</strong>
      <span class="mono">${esc((b.days||[]).join(", ").toUpperCase() || "EVERY DAY")} · ${esc(b.start)}–${esc(b.end)} · ${esc((b.type||"personal").toUpperCase())}</span>
      <div class="plan-actions"><button class="mini-btn danger delete-schedule" data-index="${i}">DELETE</button></div>
    </div>`).join(""):`<div class="small mono">NO FIXED BLOCKS YET</div>`;

  return `
    <div class="calendar-summary">
      <div class="calendar-chip"><div class="small mono">FIXED TODAY</div><div class="v mono">${todays.length}</div></div>
      <div class="calendar-chip"><div class="small mono">AUTO TASKS</div><div class="v mono">${auto.length}</div></div>
      <div class="calendar-chip"><div class="small mono">FREE TIME</div><div class="v mono">${formatMin(free)}</div></div>
      <div class="calendar-chip"><div class="small mono">DAILY MISSIONS</div><div class="v mono">${buildDailyPlan().length}</div></div>
    </div>

    <div class="schedule-shell">
      <div class="schedule-sidebar">
        <div>
          <div class="listlabel mono">ADD FIXED BLOCK</div>
          <div class="schedule-form">
            <input id="schedTitle" class="schedule-input" placeholder="Class / Work / Commute / Event">
            <select id="schedType" class="schedule-select">
              <option value="class">Class</option>
              <option value="work">Work</option>
              <option value="commute">Commute</option>
              <option value="personal">Personal</option>
            </select>
            <input id="schedStart" class="schedule-input" type="time" value="09:00">
            <input id="schedEnd" class="schedule-input" type="time" value="10:00">
            <input id="schedDays" class="schedule-input" placeholder="Days: mon,tue,wed">
            <button id="addScheduleBlock" class="btn">ADD BLOCK</button>
          </div>
        </div>

        <div>
          <div class="listlabel mono">SAVED BLOCKS</div>
          <div class="schedule-list">${blockList}</div>
        </div>

        <div class="auto-plan-status mono">
          NEXUS auto-places unfinished daily missions into free time between 08:00 and 23:00.
        </div>
      </div>

      <div>${renderTimelineHtml()}</div>
    </div>
  `;
}

function attachScheduleHandlers(){
  const add=$("addScheduleBlock");
  if(add){
    add.addEventListener("click",()=>{
      const title=$("schedTitle").value.trim();
      const type=$("schedType").value;
      const start=$("schedStart").value;
      const end=$("schedEnd").value;
      const days=$("schedDays").value.toLowerCase().split(",").map(x=>x.trim()).filter(Boolean);

      if(!title || !start || !end) return;
      if(minutesFromTime(end)<=minutesFromTime(start)) return alert("End time must be after start time.");

      const items=getScheduleBlocks();
      items.push({title,type,start,end,days});
      saveScheduleBlocks(items);
      modalContent.innerHTML=scheduleWorkspaceHtml();
      attachScheduleHandlers();
    });
  }

  document.querySelectorAll(".delete-schedule").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const items=getScheduleBlocks();
      items.splice(Number(btn.dataset.index),1);
      saveScheduleBlocks(items);
      modalContent.innerHTML=scheduleWorkspaceHtml();
      attachScheduleHandlers();
    });
  });
}
